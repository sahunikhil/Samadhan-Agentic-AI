apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: samadhan
resources:
  - namespace.yaml
  - configmap.yaml
  - api.yaml
  - mcp-servers.yaml
  - qdrant.yaml
  - init-job.yaml
  - network-policy.yaml
  - ingress.yaml
images:
  - name: samadhan
    newName: ghcr.io/your-org/samadhan   # set by CI: kustomize edit set image samadhan=...:<git-sha>
    newTag: latest
labels:
  - pairs:
      app.kubernetes.io/part-of: samadhan
    includeSelectors: false
