# Full stack on one machine:  cp .env.example .env  (add a free LLM key)  &&  docker compose up -d
#   UI + API       http://localhost:8000        (docs at /docs, metrics at /metrics)
#   Knowledge MCP  http://localhost:8000/mcp/knowledge
#   Qdrant UI      http://localhost:6333/dashboard
#   A2A agent card http://localhost:8000/.well-known/agent-card.json
# Distributed tracing (OpenTelemetry -> Jaeger):
#   OTEL_ENABLED=true docker compose --profile tracing up -d   ->  Jaeger UI http://localhost:16686
name: samadhan

x-app: &app
  build: .
  image: samadhan:latest
  env_file: .env
  restart: unless-stopped
  # Dev: one auto-generated Ed25519 key pair shared by the API (signs) and the MCP servers (verify).
  volumes: [keys:/app/.data/keys]
  environment: &app-env
    SAMADHAN_ENVIRONMENT: ${SAMADHAN_ENVIRONMENT:-dev}
    SAMADHAN_PERSISTENCE__DATABASE_URL: postgresql://samadhan:${POSTGRES_PASSWORD:-samadhan}@postgres:5432/samadhan
    SAMADHAN_RETRIEVAL__QDRANT_URL: http://qdrant:6333
    SAMADHAN_MCP__COMMERCE_URL: http://commerce:8101/mcp
    SAMADHAN_MCP__HELPDESK_URL: http://helpdesk:8102/mcp
    SAMADHAN_MCP__COMMERCE_DB_URL: postgresql+psycopg://samadhan:${POSTGRES_PASSWORD:-samadhan}@postgres:5432/commerce
    SAMADHAN_MCP__HELPDESK_DB_URL: postgresql+psycopg://samadhan:${POSTGRES_PASSWORD:-samadhan}@postgres:5432/helpdesk
    SAMADHAN_OBSERVABILITY__OTEL_ENABLED: ${OTEL_ENABLED:-false}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}

services:
  postgres:
    # One Postgres for everything: LangGraph checkpoints + Store (pgvector), commerce and helpdesk DBs.
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_USER: samadhan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-samadhan}
      POSTGRES_DB: samadhan
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samadhan -d samadhan"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]
    restart: unless-stopped

  init:
    # One-shot: seed demo data + (incrementally) index the knowledge base.
    <<: *app
    command: ["sh", "-c", "samadhan keys ensure && samadhan seed && samadhan ingest"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }

  commerce:
    <<: *app
    command: ["samadhan", "serve", "commerce"]
    environment:
      <<: *app-env
      HEALTHCHECK_URL: http://127.0.0.1:8101/health
    depends_on:
      init: { condition: service_completed_successfully }

  helpdesk:
    <<: *app
    command: ["samadhan", "serve", "helpdesk"]
    environment:
      <<: *app-env
      HEALTHCHECK_URL: http://127.0.0.1:8102/health
    depends_on:
      init: { condition: service_completed_successfully }

  api:
    <<: *app
    command: ["samadhan", "serve", "api"]
    ports: ["8000:8000"]
    depends_on:
      commerce: { condition: service_healthy }
      helpdesk: { condition: service_healthy }

  jaeger:
    # OTLP receiver (4317 gRPC / 4318 HTTP) + UI. In production point OTEL_EXPORTER_OTLP_ENDPOINT at an
    # OpenTelemetry Collector (sampling, PII scrubbing, fan-out to Tempo/Honeycomb/Datadog/cloud tracing).
    image: jaegertracing/jaeger:2.21.0
    profiles: ["tracing"]
    ports: ["16686:16686"]
    restart: unless-stopped

volumes:
  keys:
  pgdata:
  qdrant:
