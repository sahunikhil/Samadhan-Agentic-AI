name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SAMADHAN_ENVIRONMENT: test
  SAMADHAN_RETRIEVAL__MODEL_CACHE_DIR: ${{ github.workspace }}/.models
  PYTHONIOENCODING: utf-8

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy

  test:
    name: Tests (unit + integration, no API keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - name: Cache ONNX models
        uses: actions/cache@v4
        with:
          path: .models
          key: fastembed-${{ hashFiles('src/samadhan/config.py') }}
      - run: uv sync --locked
      - run: uv run pytest -q --cov=samadhan --cov-report=term-missing:skip-covered

  dependency-audit:
    name: Dependency audit (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # The shipped image's dependency set (no dev/eval extras) must have no known vulnerabilities.
      - run: uv export --locked --format requirements-txt --no-hashes --no-dev --extra observability --no-emit-project > prod-requirements.txt
      - run: uvx pip-audit -r prod-requirements.txt --no-deps --disable-pip

  pgvector:
    name: pgvector backend (Postgres service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env: { POSTGRES_USER: samadhan, POSTGRES_PASSWORD: samadhan, POSTGRES_DB: samadhan }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U samadhan" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SAMADHAN_TEST_DATABASE_URL: postgresql://samadhan:samadhan@localhost:5432/samadhan
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - uses: actions/cache@v4
        with:
          path: .models
          key: fastembed-${{ hashFiles('src/samadhan/config.py') }}
      - run: uv sync --locked
      - run: uv run pytest -q -m postgres

  retrieval-eval:
    name: Retrieval quality gate (no LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - uses: actions/cache@v4
        with:
          path: .models
          key: fastembed-${{ hashFiles('src/samadhan/config.py') }}
      - run: uv sync --locked --extra eval
      - run: uv run samadhan eval all --only retrieval
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: retrieval-report, path: evals/reports/ }

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: samadhan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
