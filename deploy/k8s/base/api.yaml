apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: caseflow-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: caseflow-api } }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: caseflow-api, role: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      # Long agent turns: give in-flight runs time to drain (RunControl) and checkpoint on SIGTERM.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: caseflow
          args: ["caseflow", "serve", "api"]
          ports: [{ containerPort: 8000, name: http }]
          envFrom:
            - configMapRef: { name: caseflow-config }
            - secretRef: { name: caseflow-secrets }
          resources:
            requests: { cpu: 500m, memory: 768Mi }   # ONNX embedding + reranker models live in RAM
            limits: { memory: 1536Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            # The Hugging Face / ONNX model cache may create lock files next to the baked-in models,
            # so the API keeps a writable root FS. MCP servers (no models) run read-only.
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: caseflow-api }
  ports: [{ port: 80, targetPort: http, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector: { matchLabels: { app: caseflow-api } }
