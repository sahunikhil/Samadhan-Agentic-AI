# MCP servers run in stateless Streamable-HTTP mode, so they scale horizontally
# behind a plain ClusterIP Service - no sticky sessions needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce
spec:
  replicas: 2
  selector: { matchLabels: { app: samadhan-commerce } }
  template:
    metadata:
      labels: { app: samadhan-commerce, role: mcp }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: commerce
          image: samadhan
          args: ["samadhan", "serve", "commerce"]
          ports: [{ containerPort: 8101, name: http }]
          envFrom:
            - configMapRef: { name: samadhan-config }
            - secretRef: { name: samadhan-secrets }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 384Mi }
          readinessProbe: { httpGet: { path: /health, port: http } }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 20 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: commerce
spec:
  selector: { app: samadhan-commerce }
  ports: [{ port: 8101, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk
spec:
  replicas: 1
  selector: { matchLabels: { app: samadhan-helpdesk } }
  template:
    metadata:
      labels: { app: samadhan-helpdesk, role: mcp }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: helpdesk
          image: samadhan
          args: ["samadhan", "serve", "helpdesk"]
          ports: [{ containerPort: 8102, name: http }]
          envFrom:
            - configMapRef: { name: samadhan-config }
            - secretRef: { name: samadhan-secrets }
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            limits: { memory: 320Mi }
          readinessProbe: { httpGet: { path: /health, port: http } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: helpdesk
spec:
  selector: { app: samadhan-helpdesk }
  ports: [{ port: 8102, targetPort: http }]
