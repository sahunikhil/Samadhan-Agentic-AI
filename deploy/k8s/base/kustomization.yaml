apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: caseflow
resources:
  - namespace.yaml
  - configmap.yaml
  - api.yaml
  - mcp-servers.yaml
  - qdrant.yaml
  - init-job.yaml
  - network-policy.yaml
  - ingress.yaml
images:
  - name: caseflow
    newName: ghcr.io/your-org/caseflow   # set by CI: kustomize edit set image caseflow=...:<git-sha>
    newTag: latest
labels:
  - pairs:
      app.kubernetes.io/part-of: caseflow
    includeSelectors: false
