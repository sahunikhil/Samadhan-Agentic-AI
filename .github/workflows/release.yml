name: Release image

# On a version tag: build the one image every service runs, publish it to GHCR, generate an SBOM,
# fail on critical vulnerabilities, and sign image + SBOM with Sigstore cosign (keyless: the
# signature is bound to this repository's GitHub OIDC identity - no signing key to manage or leak).
# Verify a deployment with:
#   cosign verify ghcr.io/<owner>/<repo>:<tag> \
#     --certificate-identity-regexp 'https://github.com/<owner>/<repo>/.github/workflows/release.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write   # push to GHCR
  id-token: write   # keyless signing (Sigstore Fulcio certificate from the workflow's OIDC token)

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max   # SLSA build provenance attestation
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Vulnerability scan (fail on critical)
        uses: anchore/scan-action@v7
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: critical

      - uses: sigstore/cosign-installer@v4
      - name: Sign image and attest SBOM (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE"
      - uses: actions/upload-artifact@v7
        with: { name: sbom, path: sbom.spdx.json }
