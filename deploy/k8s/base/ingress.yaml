apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: samadhan
  annotations:
    # SSE: disable response buffering and allow long-lived streams (ingress-nginx syntax;
    # translate for Traefik/HAProxy/cloud load balancers).
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [support.example.com]
      secretName: samadhan-tls
  rules:
    - host: support.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: api, port: { name: http } } }
